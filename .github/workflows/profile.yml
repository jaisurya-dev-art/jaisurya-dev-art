# Builds the profile's cards (stats, languages, projects) and the contribution snake in the profile's
# colors, and publishes them to the `output` branch the README reads from. Runs daily and on demand.
name: Profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cards
        run: python .github/scripts/cards.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#3b6f96&color_dots=#ebedf0,#cfe1ee,#9dc3dd,#5f93bd,#3b6f96
            dist/snake-dark.svg?palette=github-dark&color_snake=#b5d3e7&color_dots=#161b22,#1c3346,#2c5577,#4f86b0,#7ba7c7

      - name: Publish
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
